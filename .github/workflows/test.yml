name: organism-self-test

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run organism self-evaluation
        run: python organism.py eval
      - name: Run provider boundary tests
        run: python -m unittest -v test_providers.py
